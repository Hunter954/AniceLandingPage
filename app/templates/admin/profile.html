{% extends 'admin/base.html' %}{% block content %}
<div class="page-title"><div><span class="page-kicker">MINHA CONTA</span><h1>Meu perfil</h1><p class="section-hint">Atualize seus dados pessoais e credenciais de acesso.</p></div></div>
<form method="post"><div class="card-admin" style="max-width:760px"><div class="form-section-head"><div class="form-section-icon"><i class="bi bi-person-circle"></i></div><div><h5>Dados da conta</h5><p>Informações vinculadas ao seu usuário no painel.</p></div></div><div class="row g-3"><div class="col-md-7"><label class="form-label">Nome</label><input class="form-control" name="name" required value="{{current_user.name}}"></div><div class="col-md-5"><label class="form-label">Telefone</label><input class="form-control" name="phone" value="{{current_user.phone or ''}}"></div><div class="col-12"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required value="{{current_user.email}}"></div><div class="col-12"><label class="form-label">Nova senha</label><div class="password-field"><input class="form-control" id="profilePassword" type="password" name="password" placeholder="Deixe em branco para manter a atual"><button type="button" class="password-eye" onclick="const i=document.getElementById('profilePassword');i.type=i.type==='password'?'text':'password';this.querySelector('i').className=i.type==='password'?'bi bi-eye':'bi bi-eye-slash'"><i class="bi bi-eye"></i></button></div></div></div><button class="btn btn-primary btn-admin-action mt-4"><i class="bi bi-check2-circle"></i> Salvar perfil</button></div></form>
{% endblock %}
