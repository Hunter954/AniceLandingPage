<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;display:grid;place-content:center;background:linear-gradient(135deg,#061c73,#0c49e5);font-family:Arial}.box{width:min(420px,92vw);background:#fff;padding:2rem;border-radius:18px;box-shadow:0 25px 60px #00144f66}.brand{font-weight:800;color:#0739bc;font-size:1.5rem}.brand span{color:#ffcc00}</style></head><body><form class="box" method="post"><div class="brand mb-1">ADMIN <span>PREMIUM</span></div><p class="text-muted">Acesse o painel de gestão do website.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% endwith %}<label class="form-label">E-mail</label><input class="form-control mb-3" type="email" name="email" value="admin@site.com" required><label class="form-label">Senha</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">ENTRAR</button><small class="d-block mt-3 text-muted">Senha inicial definida no arquivo .env.</small></form></body></html>
