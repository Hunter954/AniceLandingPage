{% extends 'admin/base.html' %}{% block content %}<div class="page-title"><div><h1>{{group}}</h1><p class="section-hint">Edite os campos desta área e salve.</p></div></div><form method="post" enctype="multipart/form-data"><div class="card-admin"><div class="row g-3">{% for item in items %}<div class="col-md-6"><label class="form-label">{{item.label}}</label>{% if item.kind=='image' %}{% if item.value %}<div class="mb-2"><img class="thumb" src="{{url_for('site.uploads',filename=item.value)}}"></div>{% endif %}<input class="form-control" type="file" name="{{item.key}}" accept="image/*">{% elif item.kind=='color' %}<input class="form-control form-control-color" type="color" name="{{item.key}}" value="{{item.value}}">{% elif item.value|length > 120 %}<textarea class="form-control" rows="4" name="{{item.key}}">{{item.value}}</textarea>{% else %}<input class="form-control" name="{{item.key}}" value="{{item.value}}">{% endif %}</div>{% endfor %}</div><button class="btn btn-primary mt-4"><i class="bi bi-check2-circle"></i> Salvar alterações</button></div></form>{% endblock %}
